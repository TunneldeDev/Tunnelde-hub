name: PR policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  statuses: write
concurrency:
  group: policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  policy:
    name: Check PR title
    runs-on: ubuntu-latest
    steps:
      # Read metadata only. Never check out or execute code from a contributor here.
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
            const valid = /^(feat|fix|docs|ci|build|refactor|perf|test|chore|revert)(\([a-z0-9][a-z0-9._/-]*\))?!?: \S[^\r\n]{0,150}$/.test(pr.title);
            const description = valid ? 'Conventional Commit title is ready for squash.' : 'Use type(scope): concise description, e.g. feat(plugins): add PDF previews';
            await github.rest.repos.createCommitStatus({...context.repo, sha: pr.head.sha,
              context: 'PR title', state: valid ? 'success' : 'failure', description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            if (!valid) core.setFailed(description);
