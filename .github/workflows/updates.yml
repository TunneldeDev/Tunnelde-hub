name: Discover plugin updates
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: plugin-catalogue-updates
  cancel-in-progress: false
jobs:
  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Discover and verify released versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run updates
      - run: npm run verify
      - name: Open or update reviewed catalogue PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: codex/plugin-catalogue-updates
          commit-message: 'chore(catalogue): update verified plugin releases'
          title: 'chore(catalogue): update verified plugin releases'
          body: 'Update plugin links from independently published releases. Each archive was downloaded and checked against its SHA-256, package identity, manifest and license. Review before merging.'
          add-paths: |
            catalogue/
            registry.json
      - name: Explicitly dispatch validation for the bot branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh workflow run validate.yml --ref codex/plugin-catalogue-updates
          gh workflow run pr-policy.yml --ref codex/plugin-catalogue-updates -f pull_request="$PR_NUMBER"
