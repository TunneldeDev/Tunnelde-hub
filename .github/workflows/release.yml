name: Release packages
on:
  push:
    tags: ['plugins-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing package tag (plugins-vX.Y.Z); reruns resume and verify assets'
        required: true
        type: string
      prerelease:
        description: 'Publish as a plugin preview release'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  source:
    name: Validate package tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/github-script@v7
        id: tag
        env:
          PACKAGE_TAG: ${{ inputs.tag || github.ref_name }}
        with:
          retries: 3
          script: |
            const tag = process.env.PACKAGE_TAG;
            if (!/^plugins-v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid package tag');
            let {data: {object}} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
            for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
              ({data: {object}} = await github.rest.git.getTag({...context.repo, tag_sha: object.sha}));
            }
            if (object.type !== 'commit') throw new Error('Tag must resolve to a commit');
            core.setOutput('tag', tag);
            core.setOutput('sha', object.sha);
  publish:
    name: Verify and publish packages
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/checkout@v4
        with:
          ref: main
          path: publisher
          persist-credentials: false
      - name: Determine whether this is a published release recovery
        id: existing
        uses: actions/github-script@v7
        env:
          PACKAGE_TAG: ${{ needs.source.outputs.tag }}
        with:
          retries: 3
          script: |
            try {
              const {data} = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.PACKAGE_TAG
              });
              core.setOutput('published', String(!data.draft));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('published', 'false');
            }
      - name: Check out current application catalogue
        if: steps.existing.outputs.published != 'true'
        uses: actions/checkout@v4
        with:
          repository: TunneldeDev/Tunnelde
          ref: dev
          path: application
          persist-credentials: false
      - name: Check SDK catalogue before publishing
        if: steps.existing.outputs.published != 'true'
        run: node publisher/scripts/ci/check-release-sdk.mjs application sdk
      - run: npm run verify
      - run: npm run package
      - name: Collect versioned assets
        env:
          TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/release.mjs "$TAG"
      - name: Publish immutable packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_TAG: ${{ needs.source.outputs.tag }}
          PACKAGE_SHA: ${{ needs.source.outputs.sha }}
          PACKAGE_PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
        run: node publisher/scripts/publishing/publish.mjs
